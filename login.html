<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MYTV</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>MYTV</h1>
                <p>Your Premium IPTV Experience</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="profile-name">Profile Name</label>
                    <input type="text" id="profile-name" name="profile-name" placeholder="My IPTV" required>
                </div>

                <div class="form-group">
                    <label for="server-url">Server URL</label>
                    <input type="text" id="server-url" name="server-url" placeholder="http://example.com:8080" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="password" required>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>

                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="js/storage.js?v=15"></script>
    <script src="js/api.js?v=15"></script>
    <script src="js/auth.js?v=15"></script>
</body>
</html>
