<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In - MYTV</title>
    <link rel="stylesheet" href="css/login.css?v=4">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>MYTV</h1>
                <p>Premium Streaming Experience</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="serverUrl">Server URL</label>
                    <input 
                        type="text" 
                        id="serverUrl" 
                        name="serverUrl" 
                        placeholder="http://example.com:8080" 
                        autocomplete="url"
                        required
                    >
                    <small>Enter your IPTV server address</small>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="submit-btn">Sign In</button>

                <div class="info-box">
                    <p>
                        <span>💡</span>
                        <span>All credentials are accepted for testing</span>
                    </p>
                </div>
            </form>

            <div class="footer-text">
                <p>Don't have credentials? Contact your service provider</p>
            </div>
        </div>

        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <!-- Scripts with cache busting -->
    <script src="js/storage.js?v=4"></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/auth.js?v=4"></script>
</body>
</html>
