<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In - MYTV</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>MYTV</h1>
                <p>Premium Streaming Experience</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="serverUrl">Server URL</label>
                    <input 
                        type="text" 
                        id="serverUrl" 
                        name="serverUrl" 
                        placeholder="http://example.com" 
                        required
                    >
                    <small style="color: #64748b; font-size: 12px; margin-top: 4px; display: block;">
                        Enter your IPTV server URL
                    </small>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="submit-btn">Sign In</button>

                <div style="text-align: center; margin-top: 20px; padding: 15px; background: #f0f9ff; border-radius: 8px; border-left: 4px solid #3b82f6;">
                    <p style="margin: 0; color: #1e40af; font-size: 13px; font-weight: 500;">
                        💡 Any valid credentials will be accepted
                    </p>
                </div>
            </form>

            <div class="footer-text">
                <p>Don't have an account? Contact your service provider</p>
            </div>
        </div>

        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <!-- Scripts with cache busting -->
    <script src="js/storage.js?v=3"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
</body>
</html>
