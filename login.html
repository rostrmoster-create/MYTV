<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MYTV</title>
    <link rel="stylesheet" href="css/login.css?v=12">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <h1 class="logo">MYTV</h1>
                <p class="tagline">Your Premium IPTV Experience</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter any username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter any password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="divider">
                <span>Demo Access</span>
            </div>

            <div class="demo-info">
                <h3>🎬 Welcome to MYTV!</h3>
                <p>Enter any username and password to explore the platform</p>
            </div>

            <div class="features">
                <h4>Features Include:</h4>
                <div class="feature-list">
                    <div class="feature-item">
                        <span class="feature-icon">📡</span>
                        <span>Live TV Channels</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎬</span>
                        <span>Movies Library</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📺</span>
                        <span>TV Series</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">⭐</span>
                        <span>Favorites & Recently Watched</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js?v=12"></script>
    <script src="js/auth.js?v=12"></script>
</body>
</html>
