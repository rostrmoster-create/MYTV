<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTV - Your Entertainment</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Mobile Menu Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <!-- Logo -->
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="12" fill="url(#gradient-sidebar)"/>
                    <path d="M14 18L18 32H20L24 20L28 32H30L34 18H32L29 28L25 16H23L19 28L16 18H14Z" fill="white"/>
                    <defs>
                        <linearGradient id="gradient-sidebar" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#667EEA"/>
                            <stop offset="1" stop-color="#764BA2"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">MYTV</span>
            </div>
            <button class="mobile-close" id="mobileClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
            <a href="#home" class="nav-item active" data-page="home">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 10L10 3L17 10M5 8V17H8V13H12V17H15V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Home</span>
            </a>

            <a href="#livetv" class="nav-item" data-page="livetv">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M6 15L8 17M14 15L12 17M6 4L10 1L14 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Live TV</span>
            </a>

            <a href="#movies" class="nav-item" data-page="movies">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M2 8H18M6 4V8M10 4V8M14 4V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Movies</span>
            </a>

            <a href="#series" class="nav-item" data-page="series">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M2 7H18" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="10" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="14" cy="12" r="1.5" fill="currentColor"/>
                </svg>
                <span>Series</span>
            </a>

            <div class="nav-divider"></div>

            <a href="#favorites" class="nav-item" data-page="favorites">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 3L12.163 7.38L17 8.045L13.5 11.455L14.326 16.27L10 14.005L5.674 16.27L6.5 11.455L3 8.045L7.837 7.38L10 3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Favorites</span>
            </a>

            <a href="#recent" class="nav-item" data-page="recent">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 6V10L13 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Recently Watched</span>
            </a>

            <a href="#settings" class="nav-item" data-page="settings">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 1V4M10 16V19M19 10H16M4 10H1M16.364 16.364L14.243 14.243M5.757 5.757L3.636 3.636M16.364 3.636L14.243 5.757M5.757 14.243L3.636 16.364" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Settings</span>
            </a>
        </nav>

        <!-- User Profile (Bottom) -->
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="4" fill="currentColor"/>
                        <path d="M4 18C4 14.134 6.686 11 10 11C13.314 11 16 14.134 16 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="user-info">
                    <div class="user-name" id="userName">Loading...</div>
                    <div class="user-status">Premium</div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                        <path d="M13 3H16C17.105 3 18 3.895 18 5V15C18 16.105 17.105 17 16 17H13M8 13L3 8M3 8L8 3M3 8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <h1 class="page-title" id="pageTitle">Home</h1>
            </div>

            <div class="header-right">
                <!-- Search Bar -->
                <div class="search-container">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="Search channels, movies, series..."
                    >
                </div>

                <!-- Profile Button (Desktop) -->
                <button class="profile-btn" id="profileBtn">
                    <div class="profile-avatar">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="7" r="4" fill="currentColor"/>
                            <path d="M4 18C4 14.134 6.686 11 10 11C13.314 11 16 14.134 16 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                </button>
            </div>
        </header>

        <!-- Page Content Container -->
        <div class="content-container" id="contentContainer">
            <!-- Content will be dynamically loaded here -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
